# 'orphan' is not the entry and nothing falls back to it.
routes:
  - id: chat
    priority: 10
    entry: primary
    nodes:
      - id: primary
        provider: openai
        model: gpt-4o
        terminal: true
      - id: backup
        provider: anthropic
        model: claude-sonnet-4
        terminal: true
      - id: orphan
        provider: mistral
        model: mistral-large
        terminal: true
    fallbacks:
      - from: primary
        to: backup
        on: timeout
