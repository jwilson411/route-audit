name: route-audit
description: >-
  Lint a routing graph and audit it against a policy, offline. Installs
  route-audit from the checked-out repository and runs it against local
  YAML files. It opens no sockets, holds no credentials, and validates
  architecture without sending or proxying prompts.

inputs:
  routes:
    description: Path to the routing graph YAML file
    required: true
  policy:
    description: >-
      Path to the policy YAML file. When set, the audit runs after the
      lint and the coverage matrix is written to the job summary.
    required: false
    default: ""
  python-version:
    description: Python version to install route-audit under
    required: false
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    # The caller has already checked this repository out, so the package
    # comes from the workspace. Nothing else is fetched.
    - name: Install route-audit
      shell: bash
      run: |
        python -m pip install --upgrade pip
        pip install "$GITHUB_WORKSPACE"

    - name: Lint the routing graph
      shell: bash
      run: route-audit lint "${{ inputs.routes }}"

    - name: Audit against the policy
      if: inputs.policy != ''
      shell: bash
      run: route-audit audit "${{ inputs.routes }}" --policy "${{ inputs.policy }}"

    # The matrix is configuration metadata: route ids, node ids, scenario
    # names, diagnostic codes. No file contents are echoed.
    - name: Write the coverage matrix to the job summary
      if: always() && inputs.policy != ''
      shell: bash
      run: |
        route-audit report "${{ inputs.routes }}" --policy "${{ inputs.policy }}" \
          --format markdown >> "$GITHUB_STEP_SUMMARY" || true
