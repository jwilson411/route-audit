[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "route-audit"
version = "0.1.0"
description = "Static routing-graph parser, linter, offline route simulator, and policy auditor: cycles, dangling aliases, unreachable nodes, duplicate priorities, missing terminal models, outage/capability simulation, and policy audit of provider, region, hop, and downgrade boundaries."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Justin Wilson" }]
keywords = ["llm", "routing", "linter", "static-analysis", "yaml"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
route-audit = "route_audit.cli:main"

[project.urls]
Homepage = "https://github.com/jwilson411/route-audit"
Source = "https://github.com/jwilson411/route-audit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
